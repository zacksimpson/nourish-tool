[tool]
id = "com.zacksimpson.nourish"
label = "Nourish"
versionCode = 2
versionName = "2.0.0"
# Daily check-in reminder notifications are deferred — the SDK has no local
# notification-posting API (only server-initiated push); see LIGHT_SDK_MIGRATION.md §0
# in the nourish-tool repo.
# INTERNET/ACCESS_NETWORK_STATE for OpenFoodFacts nutrition lookups (utils/offApi.ts).
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"]
# LightOS server package on real LP3 hardware.
# For the local LightOS emulator instead, use "com.thelightphone.sdk.emulator".
serverPackage = "com.lightos"
